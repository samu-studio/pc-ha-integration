[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-ha-bridge"
version = "0.1.0"
description = "Control a Fedora/KDE Plasma PC from Home Assistant via MQTT discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0",
    "psutil>=5.9",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pc-ha-bridge = "pc_ha_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
